services:
  database:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5436:5432
    volumes:
      - ./pgdata:/var/lib/postgresql/data/postgres
      - ./utils/scripts:/docker-entrypoint-initdb.d
    restart: always
  redis:
    image: redis/redis-stack-server
    ports:
      - 6379:6379
    restart: always