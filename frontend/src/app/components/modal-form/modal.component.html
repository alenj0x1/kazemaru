<div class="modal-container">
  <div class="modal-form" [ngClass]="{ 'modal-active': active }">
    <h3 class="subt">{{ title }}</h3>

    <ng-content></ng-content>

    <div class="flex gap-2 justify-end">
      <button type="button" class="button-danger" (click)="onCancel()">
        <ng-icon name="tablerCarrot" />
        <span>Cancel</span>
      </button>

      <button class="button-success" (click)="onNext()">
        <ng-icon name="tablerCheck" />
        <span>Next</span>
      </button>
    </div>
  </div>
</div>
